<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const lessonsData = [
            {
                id: 1,
                title: "Lesson 01: Introduction to Bidding & Executive Pitch",
                topic: "Bidding Industry Fundamentals, Monday Routines & AI Tools",
                scheduleDate: "Monday, Aug 10, 2026 (22:00 – 22:50)",
                status: "Completed",
                speakingRatio: "Hero 51% (25m) | Lorraine 49% (24m)",
                speakingSpeed: "104 WPM",
                vocabSize: "+375 words",
                preplyClassUrl: "https://preply.com/edu/english/classroom-v2/10523965",
                selfIntroPitch: "Hello Teacher Lorraine! I am Hero Kun, currently serving as Deputy Head of Tendering and Head of Estimating at Central Cons. In my role, I spearhead commercial bids for high-rise projects, managing BOQ takeoffs and Value Engineering proposals.",
                powerWords: [
                    { word: "Bid / Tender", ipa: "/bɪd/ · /ˈten.dər/", type: "n, v", vi: "Hồ sơ dự thầu / Gói thầu", ex: "Central Cons will submit a competitive commercial bid tomorrow." },
                    { word: "Proposal", ipa: "/prəˈpəʊ.zəl/", type: "n", vi: "Hồ sơ đề xuất kỹ thuật & phương án", ex: "Our technical proposal highlights foundation Value Engineering." },
                    { word: "Client / Employer", ipa: "/ˈklaɪ.ənt/", type: "n", vi: "Chủ đầu tư (CĐT)", ex: "The Client requested a strict milestone schedule." },
                    { word: "Deadline", ipa: "/ˈded.laɪn/", type: "n", vi: "Hạn chót nộp thầu", ex: "We request a 3-day extension on the tender submission deadline." }
                ],
                grammarFixes: [
                    { wrong: "...You can teach me normally.", right: "You can teach me as you normally would.", note: "Word order & natural phrasing" },
                    { wrong: "...It is same.", right: "It's the same.", note: "Article 'the' before 'same'" },
                    { wrong: "...But have you any question after my lesson.", right: "Do you have any questions after my lesson?", note: "Present simple question with 'Do' & plural 'questions'" },
                    { wrong: "...So if you need you have to go to bed early to recovery.", right: "So if you need to recover, you should go to bed early.", note: "Infinitive 'to recover' & polite modal 'should'" },
                    { wrong: "...Do you what do you do.", right: "What do you do?", note: "Clean question phrasing without extra words" }
                ],
                synonymUpgrades: [
                    { user: "normally", better: "typically", vi: "Thông thường / Đặc thù quy trình", ex: "In high-rise construction, Central Cons typically deploys top-down excavation." },
                    { user: "main (language)", better: "primary", vi: "Chính / Trọng tâm", ex: "The primary objective of our commercial proposal is cost predictability." },
                    { user: "repair (material)", better: "fix / amend / adjust", vi: "Sửa đổi / Hiệu chỉnh kỹ thuật", ex: "Can our team use AI to adjust and fix that BOQ take-off calculation?" },
                    { user: "realized (lesson)", better: "understood / grasped", vi: "Thấu hiểu / Nắm bắt bài học", ex: "I fully understood the contract risk allocation after Teacher Lorraine's explanation." }
                ],
                pronunciationDrills: [
                    { word: "pleasure", ipa: "/ˈpleʒ.ər/", note: "Âm /ʒ/ rung mềm vòm họng giữa từ", ex: "It is my pleasure to present our bid today." },

                    { word: "Delivery", ipa: "/dɪˈlɪv.ər.i/", type: "n", vi: "Công tác vận chuyển và giao hàng (deLIvery)", ex: "Please confirm if the delivery cost to the Thu Thiem site is included." },
                    { word: "Cost", ipa: "/kɒst/", type: "n, v", vi: "Chi phí / Giá thành vật tư", ex: "The total procurement cost must align with our approved BOQ budget." },
                    { word: "Confirm", ipa: "/kənˈfɜːm/", type: "v", vi: "Xác nhận và thống nhất điều khoản", ex: "Could you confirm the delivery date before our Friday bid submission?" },
                    { word: "Materials", ipa: "/məˈtɪə.ri.əlz/", type: "n", vi: "Vật tư xây dựng (xi măng, cốt thép, cốp pha)", ex: "Central Cons strictly procures certified high-grade construction materials." },
                    { word: "Deadline", ipa: "/ˈded.laɪn/", type: "n", vi: "Hạn chót nộp báo giá / hồ sơ thầu", ex: "We need the finalized quotation by Friday 10:00 AM." }
                ],
                grammarFocus: [
                    { title: "1. 'Could you...?' (Polite & Professional)", formula: "Could you + V-bare + Object + by [Time]?", rule: "Mẫu câu chuẩn mực và lịch thiệp nhất khi làm việc với đối tác / nhà cung cấp.", example: "Could you send us the quotation for cement and steel by Friday?" },
                    { title: "2. 'Can you...?' (Less Formal / Direct)", formula: "Can you + V-bare + Object?", rule: "Trang trọng vừa phải, sử dụng khi trao đổi công việc thường ngày.", example: "Can you confirm the delivery schedule to our site?" },
                    { title: "3. 'Please + Verb' (Direct but Polite)", formula: "Please + V-bare + Object", rule: "Mệnh lệnh lịch sự, rõ ràng, dứt khoát.", example: "Please include the transport and delivery cost in your unit price." },
                    { title: "4. 'We need...' (Firm & Professional)", formula: "We need + Noun / to Verb + by [Time]", rule: "Khẳng định mốc hạn chót quan trọng của dự án.", example: "We need the finalized proposal by Friday morning." }
                ],
                bulletPoints: [
                    "Practice linking sounds: 'Could you' /kʊdju/ and 'Can you' /kænyu/ as one smooth sound without pausing. (Luyện nối âm liền mạch không ngắt quãng.)",
                    "Keep polite request intonation rising slightly at the end of every sentence. (Lên giọng nhẹ ở cuối câu để tạo ngữ điệu lịch thiệp.)",
                    "Stress the main action verbs: SEND the quotation, CONFIRM the delivery, INCLUDE the cost. (Nhấn trọng âm rõ vào động từ hành động chính.)",
                    "Incorporate Central Cons procurement context: cement, structural rebar and ready-mix concrete. (Gắn thực tế mua sắm vật tư thép, xi măng tại Central Cons.)"

                    { q: "Could you confirm if the unit price of $120 per ton of cement includes site delivery?", a: "Yes, our quotation must specify whether site transport of $200 per truckload is included or quoted separately." },
                    { q: "Can you provide a fixed-price quotation valid for the entire 24-month construction duration?", a: "Due to raw material market fluctuations, we typically negotiate a 12-month fixed price with a FIDIC Clause 13.8 adjustment formula for subsequent months." },
                    { q: "We need the complete material quotation by Friday. Can your team guarantee this deadline?", a: "Certainly. Our pricing division will compile all BOQ quantities and issue the formal RFQ packet by Friday morning." }

            { id: 5, title: "Lesson 05: Subcontractor Procurement & Supply Chain Strategy", topic: "Tier-1 MEP Subcontractor Vetting & Long-Lead Procurement", scheduleDate: "Friday, Aug 28, 2026 (22:00 – 22:50)", status: "Scheduled", preplyClassUrl: "https://preply.com/edu/english/classroom-v2/10523965" },
            { id: 6, title: "Lesson 06: Value Engineering & Cost Optimization Proposals", topic: "Song Viet Plot 1-13 41.22B Savings & CAPEX Reduction", scheduleDate: "Monday, Aug 31, 2026 (22:00 – 22:50)", status: "Scheduled", preplyClassUrl: "https://preply.com/edu/english/classroom-v2/10523965" },
            { id: 7, title: "Lesson 07: Project Fast-Tracking & CPM Schedule Presentation", topic: "Critical Path Method, BIM 3D Phasing & Handover Milestones", scheduleDate: "Wednesday, Sep 2, 2026 (22:30 – 23:20)", status: "Scheduled", preplyClassUrl: "https://preply.com/edu/english/classroom-v2/10523965" },
            { id: 8, title: "Lesson 08: High-Pressure Post-Tender Q&A & Winning Pitch Closing", topic: "Executive Objection Handling & Final Contract Award", scheduleDate: "Friday, Sep 4, 2026 (22:00 – 22:50)", status: "Scheduled", preplyClassUrl: "https://preply.com/edu/english/classroom-v2/10523965" }

        function speakText(text) {

            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.95;
            window.speechSynthesis.speak(u);
        }

        const App = () => {

            const [dictationResult, setDictationResult] = useState('');
            const [writingInput, setWritingInput] = useState('');
            const [writingFeedback, setWritingFeedback] = useState(null);

            const selectedLesson = lessonsData.find(l => l.id === selectedLessonId) || lessonsData[2];

            const checkDictation = () => {
                if (dictationInput.toLowerCase().includes('quotation') || dictationInput.toLowerCase().includes('could you')) {
                    setDictationResult('🎉 Chính xác 100%! Bạn đã điền đúng mẫu câu yêu cầu báo giá: "Could you send us a quotation?".');

                    setDictationResult('💡 Gợi ý: Mẫu câu đúng là "Could you send us a quotation?" (Anh/Chị có thể gửi báo giá cho chúng tôi không?).');

                    score: "Band C1 - Professional Procurement RFQ (96/100)",

                <div className="min-h-screen flex flex-col">

                                </h1>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">

                                <p className="font-bold text-sm text-[#FAF5EE]">Hero Kun</p>
                                <p className="text-xs text-[#C86D7C]">Head of Bidding Strategy | Central Cons</p>
                            </div>

                    </header>

                    {/* Top Widgets Bar */}
                    <div className="bg-[#FAF5EE] border-b border-[#E8DFC8] px-6 py-3">

                                <div>
                                    <p className="text-xs text-gray-500 font-semibold uppercase">Tiến Độ Khóa Học Preply</p>

                                </div>
