                                                    <div className="p-3 bg-white rounded-xl border border-cream-200 text-xs font-bold text-emerald-800 mt-2">
                                                        {micStatus["studio_rec"]}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* ================= TAB 6: PREPLY LEARNING JOURNAL (PRO FEATURE 5 & 6) ================= */}
                                {mainTab === 'journal' && (
                                    <div className="bg-white rounded-3xl shadow-sm border border-cream-200 p-6 space-y-6">
                                        <div className="border-b border-cream-200 pb-4">
                                            <span className="text-[10px] font-extrabold uppercase bg-lavender/20 text-lavender px-2.5 py-0.5 rounded-md">
                                                Post-Lesson Logbook
                                            </span>
                                            <h2 className="text-xl font-extrabold text-charcoal-900 mt-1 flex items-center gap-2">
                                                <i className="ph-fill ph-notebook text-lavender"></i>
                                                📓 Nhật Ký Học Tập & Sổ Tay Ghi Chú Cùng Cô Lorraine Johns
                                            </h2>
                                            <p className="text-xs text-charcoal-600 mt-1">
                                                Lưu trữ trực tiếp phản hồi của giáo viên, từ vựng mới được sửa và theo dõi lộ trình 8 buổi học Preply.
                                            </p>
                                        </div>

                                        <div className="bg-cream-50 p-4 rounded-2xl border border-cream-200 space-y-3">
                                            <h3 className="font-extrabold text-xs text-charcoal-900 uppercase tracking-wider">✍️ Thêm ghi chú mới sau buổi học:</h3>
                                            <textarea 
                                                value={newJournalNote}
                                                onChange={(e) => setNewJournalNote(e.target.value)}
                                                placeholder="Nhập phản hồi cô Lorraine vừa sửa (ví dụ: chú ý phát âm âm đuôi từ 'bid', nhấn trọng âm 'proposal')..." 
                                                className="w-full p-3 bg-white rounded-xl border border-cream-200 text-xs text-charcoal-900 focus:outline-none focus:border-roseAccent h-20"
                                            ></textarea>
                                            <button onClick={addJournalEntry} className="bg-roseAccent hover:bg-roseAccent-hover text-white px-4 py-2 rounded-xl text-xs font-bold shadow-2xs">
                                                + Lưu Nhật Ký Buổi Học
                                            </button>
                                        </div>

                                        <div className="space-y-3">
                                            <h3 className="font-extrabold text-xs text-charcoal-900 uppercase tracking-wider">📖 Lịch sử nhật ký các buổi học:</h3>
                                            {journalEntries.map((ent) => (
                                                <div key={ent.id} className="p-4 rounded-2xl border border-cream-200 bg-white space-y-2 text-xs">
                                                    <div className="flex justify-between items-center">
                                                        <span className="font-extrabold text-charcoal-900">{ent.lesson} • {ent.date}</span>
                                                        <span className="bg-lavender/10 text-lavender font-bold px-2.5 py-0.5 rounded-md">Live Verified</span>
                                                    </div>
                                                    <p className="text-charcoal-800">📌 <strong>Ghi chú & Phản hồi cô Lorraine:</strong> {ent.notes}</p>
                                                    <p className="text-roseAccent">💎 <strong>Từ vựng cần nhớ:</strong> {ent.vocab}</p>
                                                    <p className="text-amber-800 font-medium">🎯 <strong>Bài tập rèn luyện:</strong> {ent.homework}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* ================= TAB 7: BILINGUAL JD ================= */}
                                {mainTab === 'jd' && (
                                    <div className="bg-white rounded-3xl shadow-sm border border-cream-200 p-6 space-y-6">
                                        <div className="flex justify-between items-center border-b border-cream-200 pb-4">
                                            <div>
                                                <span className="text-[10px] font-extrabold uppercase bg-roseAccent-light text-roseAccent px-2.5 py-0.5 rounded-md">
                                                    Corporate Job Description • Central Cons
                                                </span>
                                                <h2 className="text-xl font-extrabold text-charcoal-900 mt-1 flex items-center gap-2">
                                                    <i className="ph-fill ph-identification-card text-emerald-600"></i>
                                                    📋 Mô Tả Công Việc Song Ngữ — Trưởng Bộ Phận Giá (Phó Phòng Đấu Thầu)
                                                </h2>
                                            </div>
                                            <span className="bg-charcoal-900 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold">
                                                Hero Kun
                                            </span>
                                        </div>

                                        <div className="border border-cream-200 rounded-2xl p-5 bg-cream-50/50 space-y-3">
                                            <h3 className="text-xs font-bold text-roseAccent uppercase tracking-wider">SECTION I: GENERAL INFORMATION & PURPOSE</h3>
                                            <p className="text-xs text-charcoal-800">"Oversee, manage, and take full corporate responsibility for all estimation, pricing, BOQ rate breakdowns, Value Engineering proposals, and commercial bidding activities within the Pricing Division."</p>
                                        </div>

                                        <div className="border border-cream-200 rounded-2xl p-5 bg-white space-y-3">
                                            <h3 className="text-xs font-bold text-roseAccent uppercase tracking-wider">SECTION II: JOB QUALIFICATIONS & STANDARDS</h3>
                                            <p className="text-xs text-charcoal-800">Minimum 2 years of proven experience in equivalent estimating management. Fluent professional communication, strong reading comprehension of international contract specs; proficient in technical & commercial business correspondence.</p>
                                        </div>
                                    </div>
                                )}

                            </div>

                        </div>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
