<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Hub - Bilingual Bidding & AI News Digest</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        charcoal: {
                            900: '#231F20',
                            800: '#342E30',
                            700: '#484043',
                            500: '#786C70',
                            300: '#C9C2C5',
                            100: '#F0ECEE',
                        },
                        roseAccent: {
                            DEFAULT: '#C86D7C',
                            hover: '#B55A69',
                            light: '#FBF0F2',
                        },
                        lavender: {
                            DEFAULT: '#8B72BE',
                            light: '#F3EFEF',
                        },
                        cream: {
                            50: '#FDFBF7',
                            100: '#FAF5EE',
                            200: '#F0E8DD',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF5EE; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #C9C2C5; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const App = () => {
            const [mainTab, setMainTab] = React.useState('news'); // news, lessons, podcasts, trainer
            const [activeSubTab, setActiveSubTab] = React.useState('content'); // content, listening, speaking, reading, writing

            const speakText = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const clean = text.replace(/\(.*?\)/g, '').replace(/[^\x00-\x7F]/g, '');
                    const u = new SpeechSynthesisUtterance(clean);
                    u.lang = 'en-US';
                    u.rate = 0.92;
                    window.speechSynthesis.speak(u);
                }
            };

            return (
                <div className="min-h-screen flex flex-col text-charcoal-800 font-sans">
                    
                    {/* Header chuẩn Quốc tế */}
                    <header className="bg-charcoal-900 text-white px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-md">
                        <div className="flex items-center gap-3">
                            <h1 className="text-xl font-extrabold tracking-tight flex items-center gap-2">
                                <span className="w-3 h-3 rounded-full bg-roseAccent inline-block"></span>
                                English Hub
                            </h1>
                            <span className="bg-roseAccent/20 border border-roseAccent/40 text-roseAccent-light text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider flex items-center gap-1">
                                <i className="ph-fill ph-newspaper"></i> Daily Bilingual News & Career
                            </span>
                        </div>

                        {/* Thanh tìm kiếm từ điển Oxford */}
                        <div className="flex-1 max-w-xl mx-8 relative hidden md:block">
                            <i className="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-charcoal-300 text-base"></i>
                            <input 
                                type="text" 
                                placeholder="Tra từ điển Oxford (ví dụ: bid, tender, FIDIC, takeoff)..." 
                                className="w-full bg-charcoal-800 border border-charcoal-700 rounded-full py-2 pl-10 pr-28 text-xs text-white placeholder-charcoal-500 focus:outline-none focus:border-roseAccent transition-all"
                            />
                            <button className="absolute right-1 top-1 bottom-1 bg-roseAccent text-white font-semibold px-3 rounded-full text-xs hover:bg-roseAccent-hover transition-colors">
                                Tra từ
                            </button>
                        </div>

                        <div className="flex items-center gap-3">
                            <div className="text-right hidden lg:block">
                                <p className="text-xs font-bold text-white">Hero Nguyen</p>
                                <p className="text-[10px] text-roseAccent font-medium">Head of Bidding Strategy</p>
                            </div>
                            <div className="w-9 h-9 rounded-full border-2 border-roseAccent overflow-hidden shadow-sm">
                                <img src="https://i.pravatar.cc/100?img=11" alt="Avatar" className="w-full h-full object-cover" />
                            </div>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
                        
                        {/* 3 Thẻ Widgets Thống kê Đầu Trang (Khoa học & Gọn gàng) */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-white p-4 rounded-2xl border border-cream-200 shadow-2xs flex items-center gap-4">
                                <div className="w-12 h-12 rounded-xl bg-roseAccent/10 text-roseAccent flex items-center justify-center text-xl font-bold">
                                    <i className="ph-fill ph-chart-line-up"></i>
                                </div>
                                <div className="flex-1">
                                    <p className="text-[11px] text-charcoal-500 uppercase font-bold tracking-wider">Tiến độ khóa học Preply</p>
                                    <p className="text-sm font-extrabold text-charcoal-900">1 / 8 Buổi (13%)</p>
                                    <div className="w-full bg-cream-200 h-1.5 rounded-full mt-1.5 overflow-hidden">
                                        <div className="bg-roseAccent h-full w-[13%]"></div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white p-4 rounded-2xl border border-cream-200 shadow-2xs flex items-center gap-4">
                                <div className="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-600 flex items-center justify-center text-xl font-bold">
                                    <i className="ph-fill ph-fire"></i>
                                </div>
                                <div>
                                    <p className="text-[11px] text-charcoal-500 uppercase font-bold tracking-wider">Tần suất luyện tập tuần này</p>
                                    <p className="text-sm font-extrabold text-charcoal-900">4 / 5 Ngày Luyện tập</p>
                                    <p className="text-[10px] text-amber-600 font-semibold mt-1">Đạt mục tiêu học chuyên sâu</p>
                                </div>
                            </div>

                            <div className="bg-white p-4 rounded-2xl border border-cream-200 shadow-2xs flex items-center gap-4">

                                </div>

                                    <p className="text-sm font-extrabold text-charcoal-900">Cập nhật tự động: Đấu thầu & AI</p>
                                    <p className="text-[10px] text-lavender font-semibold mt-1">Bản tin ngày 10/08/2026</p>
                                </div>
                            </div>
                        </div>

                        {/* BỐ CỤC CHÍNH: Sidebar trái (Danh sách chủ đề) & Nội dung phải (Phân cấp tối ưu) */}
                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                            
                            {/* CỘT TRÁI: 8 Chủ đề Đấu thầu & Điều hướng nhanh (Col-span 1) */}
                            <div className="lg:col-span-1 space-y-4">
                                <div className="bg-white rounded-2xl shadow-sm border border-cream-200 overflow-hidden sticky top-24">
                                    <div className="px-4 py-3 border-b border-cream-200 bg-cream-50 flex justify-between items-center">
                                        <h3 className="font-bold text-charcoal-900 uppercase text-xs tracking-wider flex items-center gap-1.5">
                                            <i className="ph-fill ph-list-bullets text-roseAccent"></i> 8 Chủ đề Đấu thầu
                                        </h3>
                                    </div>
                                    <div className="p-2 space-y-1.5 max-h-[calc(100vh-220px)] overflow-y-auto">
                                        <div className="p-3 rounded-xl bg-roseAccent-light border border-roseAccent/40 cursor-pointer shadow-2xs">
                                            <span className="text-[10px] font-bold text-roseAccent block mb-0.5">Bài học hiện tại</span>
                                            <h4 className="font-bold text-xs text-charcoal-900 leading-snug">Buổi 01: Introduction to Bidding & Executive Pitch</h4>
                                        </div>
                                        {[2, 3, 4, 5, 6, 7, 8].map((num) => (

                                {/* TẦNG 1: MENU CHÍNH (Phân tách rõ ràng Tin tức, Bài học, Podcast, Trainer) */}

                                            onClick={() => setMainTab('lessons')}

                                                mainTab === 'lessons' ? 'bg-charcoal-900 text-white shadow-sm' : 'text-charcoal-600 hover:bg-cream-100'
                                            }`}
                                        >
                                            <i className="ph-fill ph-book-open text-roseAccent"></i> Bài Học Preply (50 Mins)
                                        </button>
                                        <button 
                                            onClick={() => setMainTab('podcasts')}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition-all ${
                                                mainTab === 'podcasts' ? 'bg-charcoal-900 text-white shadow-sm' : 'text-charcoal-600 hover:bg-cream-100'
                                            }`}
                                        >
                                            <i className="ph-fill ph-video text-lavender"></i> Podcast Chuyên Ngành
                                        </button>
                                        <button 
                                            onClick={() => setMainTab('trainer')}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition-all ${
                                                mainTab === 'trainer' ? 'bg-charcoal-900 text-white shadow-sm' : 'text-charcoal-600 hover:bg-cream-100'
                                            }`}
                                        >
                                            <i className="ph-fill ph-microphone-stage text-amber-500"></i> Pitch & IPA Trainer
                                        </button>
                                    </div>
                                    <span className="text-[11px] font-semibold text-charcoal-500 px-3 hidden xl:block">Phiên bản: 3.0 Pro Workspace</span>
                                </div>

                                {/* ================= TAB 1: ĐIỂM TIN SONG NGỮ (BILINGUAL NEWS DIGEST) ================= */}
                                {mainTab === 'news' && (
                                    <div className="space-y-4">
                                        <div className="bg-white rounded-3xl shadow-sm border border-cream-200 p-6 space-y-6">
                                            
                                            {/* Tiêu đề mục tin tức */}
                                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-cream-200 pb-4 gap-2">
                                                <div>
                                                    <span className="text-[10px] font-extrabold uppercase bg-roseAccent-light text-roseAccent px-2.5 py-0.5 rounded-md">
                                                        Executive Briefing • Cập Nhật Tự Động Hàng Ngày
                                                    </span>
                                                    <h2 className="text-xl font-extrabold text-charcoal-900 mt-1 flex items-center gap-2">
                                                        <i className="ph-fill ph-globe-hemisphere-east text-roseAccent"></i>
                                                        Trang Điểm Tin Song Ngữ Đấu Thầu & AI trong Xây Dựng
                                                    </h2>
                                                </div>
                                                <span className="bg-charcoal-900 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold shadow-2xs">
                                                    📅 Ngày: 10/08/2026
                                                </span>
                                            </div>

                                            {/* Mô tả tính năng cá nhân hóa */}
                                            <p className="text-xs text-charcoal-600 leading-relaxed bg-cream-50 p-4 rounded-2xl border border-cream-200">
                                                Tổng hợp tin tức quốc tế hàng đầu về chuyển đổi số đấu thầu, công nghệ AI bóc tách khối lượng và chiến lược hợp đồng FIDIC. Được thiết kế riêng để vừa khai thác thông tin quản lý dự án vừa mài giũa từ vựng chuyên ngành C1/C2 cho Giám đốc Đấu thầu.
                                            </p>

                                            {/* Bài viết 1: AI trong Đấu thầu */}
                                            <div className="border border-cream-200 rounded-2xl p-5 bg-white space-y-4 hover:border-roseAccent/60 transition-all shadow-2xs">
                                                <div className="flex justify-between items-center text-xs">
                                                    <span className="bg-lavender/10 text-lavender font-bold px-2.5 py-1 rounded-md uppercase">
                                                        AI & Smart Tech in Construction • Mon, Aug 10, 2026
                                                    </span>
                                                    <span className="text-charcoal-500">Nguồn: Construction Week Online</span>
                                                </div>

                                                <h3 className="text-base font-extrabold text-charcoal-900 leading-snug">
                                                    38% of General Contractors Now Deploy AI for Bid Takeoffs & Estimating
                                                    <span className="block text-xs font-semibold text-roseAccent mt-0.5">
                                                        38% Nhà Thầu Chính Hiện Ứng Dụng AI Vào Bóc Tách Khối Lượng & Lập Dự Toán Thầu
                                                    </span>
                                                </h3>

                                                {/* Khung Song Ngữ / English Briefing */}
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-1">
                                                    <div className="bg-cream-50 p-4 rounded-xl border border-cream-200 space-y-2">
                                                        <span className="text-[10px] font-bold text-charcoal-500 uppercase tracking-wider block">Bản gốc tiếng Anh (Professional)</span>
                                                        <p className="text-xs text-charcoal-800 leading-relaxed italic">
                                                            "Recent Q2 2026 commercial contractor surveys reveal a major industry shift: over 38% of general contractors are running AI platforms directly in production to automate BOQ takeoffs and bid proposals. Estimators using AI takeoffs process up to 3x more bids with the same headcount..."
                                                        </p>
                                                    </div>
                                                    <div className="bg-cream-50 p-4 rounded-xl border border-cream-200 space-y-2">
                                                        <span className="text-[10px] font-bold text-roseAccent uppercase tracking-wider block">Bản dịch nghĩa & Phân tích chuyên môn</span>
                                                        <p className="text-xs text-charcoal-700 leading-relaxed">
                                                            "Khảo sát nhà thầu thương mại Quý 2/2026 cho thấy sự chuyển dịch lớn: hơn 38% tổng thầu đang vận hành nền tảng AI trực tiếp để tự động hóa bóc tách khối lượng (BOQ) và lập hồ sơ thầu. Các kỹ sư định giá dùng AI xử lý lượng hồ sơ gấp 3 lần với cùng nhân sự..."
                                                        </p>
                                                    </div>
                                                </div>

                                                {/* Từ vựng nổi bật từ bài báo */}
                                                <div className="pt-2">
                                                    <p className="text-[11px] font-bold text-charcoal-900 uppercase tracking-wider mb-2">Từ vựng cốt lõi trích xuất từ bản tin:</p>
                                                    <div className="flex flex-wrap gap-2">
                                                        <span className="bg-cream-100 border border-cream-200 text-charcoal-800 text-xs px-3 py-1 rounded-lg font-medium">
                                                            <strong>Takeoff</strong> (n): Bóc tách khối lượng
                                                        </span>
                                                        <span className="bg-cream-100 border border-cream-200 text-charcoal-800 text-xs px-3 py-1 rounded-lg font-medium">
                                                            <strong>Headcount</strong> (n): Số lượng nhân sự
                                                        </span>
                                                        <span className="bg-cream-100 border border-cream-200 text-charcoal-800 text-xs px-3 py-1 rounded-lg font-medium">
                                                            <strong>Automate BOQ</strong> (v): Tự động hóa bảng khối lượng
                                                        </span>
                                                    </div>
                                                </div>

                                                <div className="flex justify-between items-center pt-2 border-t border-cream-200">
                                                    <button 
                                                        onClick={() => speakText("Recent Q2 2026 commercial contractor surveys reveal a major industry shift: over 38 percent of general contractors are running AI platforms directly in production to automate BOQ takeoffs and bid proposals. Estimators using AI takeoffs process up to 3 times more bids with the same headcount.")}
                                                        className="bg-roseAccent hover:bg-roseAccent-hover text-white px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-2xs"
                                                    >
                                                        <i className="ph-bold ph-speaker-high"></i> Nghe đọc bài báo (Audio Briefing)

                                                    <span className="text-[11px] text-charcoal-500">Thời gian đọc: 3 phút</span>

                                            </div>

                                                </div>

                                                <h3 className="text-base font-extrabold text-charcoal-900 leading-snug">
                                                    Vietnam Enforces Decree 274/2026/ND-CP Tightening Bidding Security & Contract Alterations
                                                    <span className="block text-xs font-semibold text-roseAccent mt-0.5">
                                                        Việt Nam Ban Hành Nghị Định 274/2026/NĐ-CP Thắt Chặt Bảo Đảm Dự Thầu & Điều Chỉnh Hợp Đồng
                                                    </span>
                                                </h3>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-1">
                                                    <div className="bg-cream-50 p-4 rounded-xl border border-cream-200 space-y-2">
                                                        <span className="text-[10px] font-bold text-charcoal-500 uppercase tracking-wider block">Bản gốc tiếng Anh (Professional)</span>
                                                        <p className="text-xs text-charcoal-800 leading-relaxed italic">
                                                            "Decree 274/2026/ND-CP introduces strict new procurement guidelines for investment projects in Vietnam. Under the new regulations, Clients and Project Directors are held fully accountable for contractual changes, while bid security guarantees and tenderer qualification assessments are strictly audited..."

                                                    </div>

                                                        <p className="text-xs text-charcoal-700 leading-relaxed">
                                                            "Nghị định 274/2026/NĐ-CP bổ sung các quy định quản lý thầu chặt chẽ đối với các dự án đầu tư tại Việt Nam. Theo quy định mới, Chủ đầu tư và Ban Quản lý Dự án chịu trách nhiệm toàn diện đối với việc thay đổi hợp đồng, đồng thời công tác bảo đảm dự thầu được kiểm toán nghiêm ngặt..."
                                                        </p>
                                                    </div>
                                                </div>

                                                <div className="pt-2">
                                                    <p className="text-[11px] font-bold text-charcoal-900 uppercase tracking-wider mb-2">Từ vựng cốt lõi trích xuất từ bản tin:</p>

                                                            <strong>Procurement Guidelines</strong> (n): Hướng dẫn quy trình thầu
                                                        </span>
                                                    </div>
                                                </div>

                                                <div className="flex justify-between items-center pt-2 border-t border-cream-200">
                                                    <button 
                                                        onClick={() => speakText("Decree 274 2026 ND-CP introduces strict new procurement guidelines for investment projects in Vietnam. Under the new regulations, Clients and Project Directors are held fully accountable for contractual changes.")}
                                                        className="bg-roseAccent hover:bg-roseAccent-hover text-white px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-2xs"
                                                    >
                                                        <i className="ph-bold ph-speaker-high"></i> Nghe đọc bài báo (Audio Briefing)
                                                    </button>
                                                    <span className="text-[11px] text-charcoal-500">Thời gian đọc: 4 phút</span>
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                )}

                                {/* ================= TAB 2: BÀI HỌC PREPLY (50 MINS) ================= */}
