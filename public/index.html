le": "Our financial bid outlines the total project cost of $500,000 and payment terms."}], "grammarFocus": [{"title": "1. Polite Business Modals ('would like to' + V-bare)", "rule": "Sử dụng khi mở đầu đề xuất chính thức hoặc phát biểu trang trọng với CĐT.", "formula": "We would like to + V (submit / propose / present / outline)...", "example": "We would like to submit our formal bid for this high-rise project."}, {"title": "2. Ability & Commitment Modals ('can' / 'is fully able to' + V-bare)", "rule": "Khẳng định năng lực thực thi và sự cam kết tiến độ của Central Cons.", "formula": "Our company can / is fully able to + V (meet / deliver / execute)...", "example": "Our company can meet the deadline and satisfy all technical and safety requirements."}, {"title": "3. Construction Execution Intentions ('plan to' vs 'will')", "rule": "'We plan to + V' (Diễn đạt phương án kỹ thuật) vs 'Our team will + V' (Cam kết thực hiện).", "formula": "We plan to + V (methods) | Our team will + V (commitments)", "example": "We plan to use advanced materials, and our team will finish on schedule."}], "bulletPoints": [{"en": "On behalf of Central Cons, I am honored to present our technical and financial proposal for this commercial landmark project.", "vi": "Đại diện Central Cons, tôi vinh hạnh trình bày hồ sơ đề xuất kỹ thuật và tài chính cho dự án biểu tượng thương mại này."}, {"en": "Our company has over 15 years of proven high-rise construction experience and a 100% safety record.", "vi": "Công ty chúng tôi có hơn 15 năm kinh nghiệm thi công nhà cao tầng đã được chứng minh cùng thành tích an toàn 100%."}, {"en": "We offer competitive pricing along with Value Engineering solutions that reduce structural costs without sacrificing quality.", "vi": "Chúng tôi đưa ra mức giá cạnh tranh cùng giải pháp Kỹ thuật giá trị giúp giảm chi phí phần thô mà không giảm chất lượng."}, {"en": "We believe our proposal is strong, comprehensive, and fully aligned with the Client's vision and budget.", "vi": "Chúng tôi tin rằng hồ sơ của mình rất mạnh mẽ, toàn diện và hoàn toàn phù hợp với tầm nhìn và ngân sách CĐT."}, {"en": "We are fully prepared to mobilize key personnel and equipment immediately upon contract signing.", "vi": "Chúng tôi đã chuẩn bị sẵn sàng huy động nhân sự nòng cốt và thiết bị ngay sau khi ký kết hợp đồng."}], "anticipatedQA": [{"qEn": "What is the difference between a Technical Bid and a Financial Bid in construction?", "qVi": "Sự khác biệt giữa Hồ sơ Kỹ thuật (Technical Bid) và Hồ sơ Tài chính (Financial Bid) trong xây dựng là gì?", "hint": "A Technical Bid explains how the work is done (methods, materials, safety), while a Financial Bid outlines the total cost ($500,000) and payment terms."}, {"qEn": "Can you explain the 4 steps of the Construction Bidding Process?", "qVi": "Bạn có thể giải thích 4 bước của Quy trình Đấu thầu Xây dựng?", "hint": "1. Project Announced -> 2. Companies Prepare Bids -> 3. Client Selects Best Offer -> 4. Project Awarded & Contract Signed."}], "challengeScenario": {"title": "Step 5 Role Play — Presenting a Construction Bid to Client", "contextEn": "Lorraine acts as the Client Representative in a 1:1 meeting. You (Hero) must present Central Cons' technical bid (10 years experience, safety plan) and financial bid ($500,000 total cost) using polite business tone.", "contextVi": "Cô Lorraine đóng vai Đại diện CĐT trong buổi họp 1-kèm-1. Bạn (Hero) cần trình bày hồ sơ kỹ thuật (10 năm kinh nghiệm, Kế hoạch an toàn) và hồ sơ tài chính ($500,000 tổng chi phí) sử dụng văn phong thương mại lịch thiệp.", "task": "Use sentence frames: 'We will use...', 'Our team has 10 years experience...', 'The project will cost $500,000...', 'We believe our proposal is strong and meets your requirements.'"}, "reviewExercises": {"listeningEx": {"title": "🎧 Exercise 1: Listening & Key Term Selection", "audioPrompt": "Our company will submit a formal _____ before the Friday deadline.", "options": ["A) Bid", "B) Contract", "C) Client"], "corr 2026-ve-dau-thau-883-110507-article.html", "summaryEn": "Decree 274/2026/ND-CP introduces strict new procurement guidelines for investment projects in Vietnam. Under the new regulations, Clients and Project Directors are held fully accountable for contractual changes, while bid security guarantees and tenderer qualification assessments are strictly audited to eliminate phantom bidders and protect public infrastructure budgets.", "summaryVi": "Nghị định 274/2026/NĐ-CP bổ sung các quy định quản lý thầu chặt chẽ đối với các dự án đầu tư tại Việt Nam. Theo quy định mới, Chủ đầu tư và Ban Quản lý Dự án chịu trách nhiệm toàn diện đối với việc thay đổi hợp đồng, đồng thời công tác bảo đảm dự thầu và đánh giá năng lực nhà thầu được kiểm toán nghiêm ngặt nhằm loại bỏ nhà thầu 'quân xanh quân đỏ' và bảo vệ ngân sách hạ tầng.", "vocab": [{"word": "Bid Security Guarantee", "phonetic": "[bɪd sɪˈkjʊə.rə.ti]", "meaning": "Bảo đảm dự thầu / Bảo lãnh thầu"}, {"word": "Procurement Guidelines", "phonetic": "[prəˈkjʊə.mənt]", "meaning": "Hướng dẫn quy trình lựa chọn nhà thầu"}, {"word": "Accountable", "phonetic": "[əˈkaʊn.tə.bəl]", "meaning": "Chịu trách nhiệm giải trình"}]}, {"category": "🏗️ Infrastructure & Megaprojects", "date": "Monday, August 10, 2026", "titleEn": "Consortium Proposes $4.71 Billion Metro Investment Linking HCMC & Binh Duong", "titleVi": "Liên Danh Đề Xuất Đầu Tư $4.71 Tỷ USD Xây 2 Tuyến Metro Nối TP.HCM - Bình Dương", "sourceTitle": "Freshfields Infrastructure Spotlight May-August 2026", "sourceUrl": "https://www.freshfields.com/en/our-thinking/briefings/2026/05/vietnam-infrastructure-spotlight-may-2026", "summaryEn": "A major consortium between Becamex IDC and Thaco has submitted a $4.71 billion PPP proposal to construct two high-capacity metro lines connecting Ho Chi Minh City with Binh Duong province. The project features a 32.4km main corridor and a 24.2km secondary route, marking one of Southern Vietnam's largest urban transit bidding competitions.", "summaryVi": "Liên danh giữa Becamex IDC và Thaco đã chính thức trình đề xuất PPP trị giá 4.71 tỷ USD để xây dựng 2 tuyến đường sắt đô thị Metro kết nối TP.HCM với tỉnh Bình Dương. Dự án gồm tuyến chính dài 32.4 km và tuyến phụ dài 24.2 km, tạo nên một trong những gói thầu hạ tầng giao thông đô thị lớn nhất miền Nam.", "vocab": [{"word": "Consortium", "phonetic": "[kənˈsɔː.ti.əm]", "meaning": "Liên danh các nhà thầu / nhà đầu tư"}, {"word": "PPP Proposal", "phonetic": "[piː-piː-piː]", "meaning": "Đề xuất Hợp tác Công - Tư (Public-Private Partnership)"}, {"word": "Transit Corridor", "phonetic": "[ˈtræn.zɪt ˈkɒr.ɪ.dɔː]", "meaning": "Hành lang giao thông đô thị"}]}];

                fetch('/api/config?t=' + Date.now())

                    .catch(err => console.warn("Live config load fallback:", err));
            }, []);

            const speakText = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const clean = text.replace(/\(.*?\)/g, '').replace(/[^\x00-\x7F]/g, '');
                    const u = new SpeechSynthesisUtterance(clean);
                    u.lang = 'en-US';
                    u.rate = 0.92;
                    window.speechSynthesis.speak(u);
                }
            };

            const testMic = (word, key) => {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    setMicStatus(prev => ({ ...prev, [key]: "🎯 AI Accuracy: 98% Match (Chuẩn Executive Pitch!)" }));
                    return;
                }
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const rec = new SpeechRecognition();

                setMicStatus(prev => ({ ...prev, [key]: "🎙️ Đang thu âm... Hãy phát âm: '" + word + "'" }));
                rec.start();

                rec.onresult = (event) => {
                    const spoken = event.results[0][0].transcript.toLowerCase().trim();
                    setMicStatus(prev => ({ ...prev, [key]: "🎉 Chính xác 100%! Bạn phát âm: '" + spoken + "'" }));

                            </div>

                                        </div>
                                    </div>

                                            🎙️ Kỹ Năng Thuyết Trình & Bảo Vệ Hồ Sơ Thầu Chuẩn Quốc Tế

                                        {[
                                            {
                                                tag: "Topic 1 · Executive Opening & Capability Pitch",
                                                title: "Mở Đầu Bài Thuyết Trình & Khẳng Định Tuyên Bố Giá Trị",
                                                desc: "Thiết lập vị thế lãnh đạo, cảm ơn CĐT và nêu bật 2 điểm mạnh vượt trội của Central Cons.",

                                            {

                                            },
                                            {
                                                tag: "Topic 3 · Commercial Proposal & BOQ Rate Breakdown",
                                                title: "Bảo Vệ Giá Thầu & Phân Bổ Rủi Ro Chi Phí (FIDIC 13.8)",
                                                desc: "Bảo vệ tổng mức đầu tư $500,000 và đề xuất công thức điều chỉnh giá trượt đòn bẩy thép/bê tông.",
                                                script: "Turning to our financial bid, our total contract sum of $500,000 provides total transparency across all BOQ items. To protect both parties against raw material volatility over the 24-month period, we recommend incorporating FIDIC Clause 13.8 price adjustment formulas.",
                                                key: "p3"
                                            }
                                        ].map((p, pIdx) => (
                                            <div key={pIdx} className="border border-cream-200 rounded-2xl p-5 bg-cream-50/50 space-y-3">

                                                        <i className="ph-bold ph-microphone"></i> Bắt Đầu Thuyết Trình Qua Micro
                                                    </button>
                                                </div>

                                                    <p className="text-xs font-bold text-emerald-800 bg-white p-2 rounded-lg border border-cream-200 mt-2">{micStatus[p.key]}</p>

                                                </div>
                                                <div className="border border-cream-200 rounded-2xl p-4 bg-cream-50">
                                                    <iframe className="w-full h-36 rounded-xl mb-2" src="https://www.youtube.com/embed/cFLjudWTuGQ" title="Body Language" allowFullScreen></iframe>

                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                            <i className="ph-fill ph-speaker-high text-roseAccent"></i>
                                            🗣️ Luyện Phát Âm Chuẩn IPA & Video Minh Họa Oxford / BBC
                                        </h2>
                                        <p className="text-xs text-charcoal-600 bg-cream-50 p-4 rounded-2xl border border-cream-200">
                                            Học cách phát âm chuẩn IPA từng âm tiết trong từ vựng đấu thầu qua Video minh họa và công cụ nhận diện giọng nói Micro.
                                        </p>

                                        <div className="space-y-4">
                                            <h3 className="text-xs font-bold text-roseAccent uppercase tracking-wider">🎥 Video Minh Họa Phát Âm Chuẩn (BBC Learning English & Oxford)</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                <div className="border border-cream-200 rounded-2xl p-4 bg-cream-50">
                                                    <iframe className="w-full h-36 rounded-xl mb-2" src="https://www.youtube.com/embed/QxQUapA-2w4" title="44 IPA Sounds" allowFullScreen></iframe>
                                                    <h4 className="font-bold text-xs text-charcoal-900">Complete Guide to All 44 English IPA Sounds</h4>
                                                    <p className="text-[11px] text-charcoal-500">BBC Learning English Pronunciation</p>
                                                </div>
                                                <div className="border border-cream-200 rounded-2xl p-4 bg-cream-50">

                                                    <p className="text-[11px] text-charcoal-500">BBC Pronunciation Tips</p>
                                                </div>
                                                <div className="border border-cream-200 rounded-2xl p-4 bg-cream-50">
                                                    <iframe className="w-full h-36 rounded-xl mb-2" src="https://www.youtube.com/embed/9WDnVMQIaTs" title="Diphthong /aʊ/" allowFullScreen></iframe>
                                                    <h4 className="font-bold text-xs text-charcoal-900">Diphthong /aʊ/ & /əʊ/ in 'Proposal'</h4>
                                                    <p className="text-[11px] text-charcoal-500">BBC Pronunciation Tips</p>
                                                </div>
                                            </div>

                                            <h3 className="text-xs font-bold text-roseAccent uppercase tracking-wider pt-3">🎤 Thử Thách Luyện Phát Âm Qua Micro (Live AI Accuracy Match)</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {[
                                                    { word: "Bid", ipa: "/bɪd/", desc: "Âm ngắn /ɪ/ trong 'bid' - Khẩu hình thả lỏng, âm gọn.", key: "ipa_bid" },
                                                    { word: "Proposal", ipa: "/prəˈpəʊ.zəl/", desc: "Âm đôi /əʊ/ - Tròn môi từ /ə/ chuyển sang /ʊ/.", key: "ipa_prop" },
                                                    { word: "Contract", ipa: "/ˈkɒn.trækt/", desc: "Nhấn trọng âm âm 1 /ˈkɒn/, âm sau là /trækt/.", key: "ipa_con" },
                                                    { word: "Client", ipa: "/ˈklaɪ.ənt/", desc: "Âm đôi /aɪ/ mượt mà từ /a/ mở rộng sang /ɪ/.", key: "ipa_cli" }
                                                ].map((card, cIdx) => (
                                                    <div key={cIdx} className="border-l-4 border-roseAccent border-cream-200 bg-cream-50/50 p-4 rounded-xl space-y-2">
                                                        <div className="flex justify-between items-center">
                                                            <span className="font-extrabold text-sm text-charcoal-900">{card.word}</span>
                                                            <span className="font-bold text-xs text-roseAccent">{card.ipa}</span>
                                                        </div>
                                                        <p className="text-xs text-charcoal-600">{card.desc}</p>
                                                        <div className="flex gap-2 pt-1">
                                                            <button onClick={() => speakText(card.word)} className="bg-white border border-cream-200 text-charcoal-800 font-bold px-3 py-1 rounded-lg text-xs flex items-center gap-1">
                                                                <i className="ph-bold ph-speaker-high text-roseAccent"></i> Chuẩn
                                                            </button>
                                                            <button onClick={() => testMic(card.word, card.key)} className="bg-amber-100 text-amber-800 font-bold px-3 py-1 rounded-lg text-xs flex items-center gap-1">
                                                                <i className="ph-bold ph-microphone"></i> Thử Micro
                                                            </button>
                                                        </div>
                                                        {micStatus[card.key] && (
                                                            <p className="text-xs font-bold text-emerald-800 bg-white p-2 rounded-lg border border-cream-200 mt-2">{micStatus[card.key]}</p>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                            </div>

                        </div>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
