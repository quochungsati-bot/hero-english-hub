<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const lessonsData = [
            {
                id: 1,
                title: "Lesson 01: Introduction to Bidding & Executive Pitch",
                topic: "Bidding Industry Fundamentals, Monday Routines & AI Tools",
                scheduleDate: "Monday, Aug 10, 2026 (22:00 – 22:50)",
                status: "Completed",
                speakingRatio: "Hero 51% (25m) | Lorraine 49% (24m)",
                speakingSpeed: "104 WPM",
                vocabSize: "+375 words",
                preplyClassUrl: "https://preply.com/edu/english/classroom-v2/10523965",
                selfIntroPitch: "Hello Teacher Lorraine! I am Hero Kun, currently serving as Deputy Head of Tendering and Head of Estimating at Central Cons. In my role, I spearhead commercial bids for high-rise projects, managing BOQ takeoffs and Value Engineering proposals.",
                powerWords: [
                    { word: "Bid / Tender", ipa: "/bɪd/ · /ˈten.dər/", type: "n, v", vi: "Hồ sơ dự thầu / Gói thầu", ex: "Central Cons will submit a competitive commercial bid tomorrow." },
                    { word: "Proposal", ipa: "/prəˈpəʊ.zəl/", type: "n", vi: "Hồ sơ đề xuất kỹ thuật & phương án", ex: "Our technical proposal highlights foundation Value Engineering." },
                    { word: "Client / Employer", ipa: "/ˈklaɪ.ənt/", type: "n", vi: "Chủ đầu tư (CĐT)", ex: "The Client requested a strict milestone schedule." },
                    { word: "Deadline", ipa: "/ˈded.laɪn/", type: "n", vi: "Hạn chót nộp thầu", ex: "We request a 3-day extension on the tender submission deadline." }
                ],
                grammarFixes: [
                    { wrong: "...You can teach me normally.", right: "You can teach me as you normally would.", note: "Word order & natural phrasing" },
                    { wrong: "...It is same.", right: "It's the same.", note: "Article 'the' before 'same'" },
                    { wrong: "...But have you any question after my lesson.", right: "Do you have any questions after my lesson?", note: "Present simple question with 'Do' & plural 'questions'" },
                    { wrong: "...So if you need you have to go to bed early to recovery.", right: "So if you need to recover, you should go to bed early.", note: "Infinitive 'to recover' & polite modal 'should'" },
                    { wrong: "...Do you what do you do.", right: "What do you do?", note: "Clean question phrasing without extra words" }
                ],
                synonymUpgrades: [
                    { user: "normally", better: "typically", vi: "Thông thường / Đặc thù quy trình", ex: "In high-rise construction, Central Cons typically deploys top-down excavation." },
                    { user: "main (language)", better: "primary", vi: "Chính / Trọng tâm", ex: "The primary objective of our commercial proposal is cost predictability." },
                    { user: "repair (material)", better: "fix / amend / adjust", vi: "Sửa đổi / Hiệu chỉnh kỹ thuật", ex: "Can our team use AI to adjust and fix that BOQ take-off calculation?" },
                    { user: "realized (lesson)", better: "understood / grasped", vi: "Thấu hiểu / Nắm bắt bài học", ex: "I fully understood the contract risk allocation after Teacher Lorraine's explanation." }
                ],
                pronunciationDrills: [
                    { word: "pleasure", ipa: "/ˈpleʒ.ər/", note: "Âm /ʒ/ rung mềm vòm họng giữa từ", ex: "It is my pleasure to present our bid today." },
                    { word: "catch", ipa: "/kætʃ/", note: "Chụm môi bật dứt khoát âm đuôi /tʃ/", ex: "We need to catch up with the concrete pouring schedule." },
                    { word: "clock", ipa: "/klɒk/", note: "Nối mượt âm đầu /kl/ và bật âm đuôi /k/", ex: "Our site engineering team operates around the clock." },
                    { word: "thing", ipa: "/θɪŋ/", note: "Đặt đầu lưỡi giữa 2 hàm răng phát âm /θ/ và âm mũi /ŋ/", ex: "The key thing in bidding is managing provisional sums." }

                status: "Completed",
                speakingRatio: "Hero 41% (20m) | Lorraine 59% (30m)",

                recapSummary: "Explored HCMC weather/floods, Landmark 81 bamboo design, high-speed rail cooperation with foreign contractors, and cultural comparisons."

                scheduleDate: "Today, Monday, Aug 24, 2026 (22:30 – 23:20)",
                status: "Tonight",
                speakingRatio: "Target: Hero 55% | Lorraine 45%",

                selfIntroPitch: "Good evening Teacher Lorraine! Tonight I am leading our commercial strategy presentation, focusing on BOQ unit rate breakdown and subcontractor procurement.",

                    { word: "Unit Rate Breakdown", ipa: "/ˈjuː.nɪt reɪt ˈbreɪk.daʊn/", type: "n", vi: "Bóc tách cơ cấu đơn giá chi tiết", ex: "Central Cons provides a transparent unit rate breakdown for concrete items." },
                    { word: "Provisional Sum", ipa: "/prəˈvɪʒ.ən.əl sʌm/", type: "n", vi: "Hạng mục tạm tính trong BOQ", ex: "We allocated a $150,000 provisional sum for deep soil stabilization." },
                    { word: "Overhead and Profit (OH&P)", ipa: "/ˈəʊ.və.hed ænd ˈprɒf.ɪt/", type: "n", vi: "Chi phí quản lý chung và lợi nhuận", ex: "Our OH&P is calibrated at 8.5% to maintain competitive pricing." },
                    { word: "Back-to-Back Contract", ipa: "/ˌbæk.təˈbæk ˈkɒn.trækt/", type: "n", vi: "Hợp đồng chuyển tiếp điều khoản với thầu phụ", ex: "We enforce back-to-back contract terms with MEP subcontractors." },
                    { word: "Long-Lead Items", ipa: "/lɒŋ liːd ˈaɪ.təmz/", type: "n", vi: "Vật tư thiết bị đặt hàng dài hạn", ex: "Façade curtain walls are critical long-lead items requiring early orders." },
                    { word: "Hedging Strategy", ipa: "/ˈhedʒ.ɪŋ ˈstræt.ə.dʒi/", type: "n", vi: "Chiến lược phòng ngừa biến động giá", ex: "Central Cons locked in bilateral steel agreements as a price hedging strategy." }
                ],
                grammarFocus: [
                    { title: "1. Adjective + that-clause Complements", formula: "Subject + Be + Adjective + that + Clause", rule: "Diễn tả sự tự tin hay khẳng định chắc chắn.", example: "I am confident that Central Cons can meet the Friday milestone deadline." },
                    { title: "2. Passive Voice in Commercial Auditing", formula: "Subject + Be + Past Participle (V3/ed)", rule: "Mô tả quy trình kiểm toán đơn giá chuyên nghiệp.", example: "All BOQ unit rates are audited against historical cost databases." },
                    { title: "3. First Conditional in Risk Negotiations", formula: "If + Present Simple, Will + Verb", rule: "Thương lượng điều kiện ràng buộc hợp đồng.", example: "If steel prices fluctuate over 10%, FIDIC Clause 13.8 will apply." }
                ],
                bulletPoints: [
                    "Justify the BOQ unit rate structure by linking direct labor to productivity benchmarks. (Giải trình cơ cấu đơn giá BOQ bằng định mức năng suất thực tế.)",
                    "Explain how back-to-back subcontractor terms protect both parties from delays. (Giải thích cách điều khoản thầu phụ bảo vệ tiến độ dự án.)",
                    "Demonstrate procurement timeline for long-lead equipment to ensure zero critical-path interruption. (Chứng minh lộ trình mua sắm thiết bị dài hạn không gián đoạn đường găng.)",
                    "Reassure the Client that our overhead and profit margins are optimized for partnership. (Tạo sự yên tâm cho CĐT về tỷ lệ lợi nhuận hợp lý.)"

                anticipatedQA: [

                    { q: "If your MEP subcontractor fails to deliver on time, who assumes liability?", a: "Central Cons assumes 100% single-point responsibility toward the Employer, backed by liquidated damages in our back-to-back subcontractor agreements." }
                ],
                challengeScenario: "During post-tender commercial negotiations, the Client's Procurement Director demands a flat 5% discount on the entire BOQ total ($1,000,000 reduction), threatening to award the project to a second-ranked bidder if Central Cons does not agree."
            },
            { id: 4, title: "Lesson 04: FIDIC Contract Clauses & Risk Allocation", topic: "FIDIC Red Book, Clause 8.4 EOT & Clause 13.8 Adjustments", scheduleDate: "Wednesday, Aug 26, 2026 (22:30 – 23:20)", status: "Scheduled", preplyClassUrl: "https://preply.com/edu/english/classroom-v2/10523965" },
            { id: 5, title: "Lesson 05: Subcontractor Procurement & Supply Chain Strategy", topic: "Tier-1 MEP Subcontractor Vetting & Long-Lead Procurement", scheduleDate: "Friday, Aug 28, 2026 (22:00 – 22:50)", status: "Scheduled", preplyClassUrl: "https://preply.com/edu/english/classroom-v2/10523965" },
            { id: 6, title: "Lesson 06: Value Engineering & Cost Optimization Proposals", topic: "Song Viet Plot 1-13 41.22B Savings & CAPEX Reduction", scheduleDate: "Monday, Aug 31, 2026 (22:00 – 22:50)", status: "Scheduled", preplyClassUrl: "https://preply.com/edu/english/classroom-v2/10523965" },
            { id: 7, title: "Lesson 07: Project Fast-Tracking & CPM Schedule Presentation", topic: "Critical Path Method, BIM 3D Phasing & Handover Milestones", scheduleDate: "Wednesday, Sep 2, 2026 (22:30 – 23:20)", status: "Scheduled", preplyClassUrl: "https://preply.com/edu/english/classroom-v2/10523965" },
            { id: 8, title: "Lesson 08: High-Pressure Post-Tender Q&A & Winning Pitch Closing", topic: "Executive Objection Handling & Final Contract Award", scheduleDate: "Friday, Sep 4, 2026 (22:00 – 22:50)", status: "Scheduled", preplyClassUrl: "https://preply.com/edu/english/classroom-v2/10523965" }
        ];

        function speakText(text) {
            if (!window.speechSynthesis) { alert('Speech synthesis not supported'); return; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.95;
            window.speechSynthesis.speak(u);
        }

        const App = () => {
            const [activeTab, setActiveTab] = useState('lessons');
            const [selectedLessonId, setSelectedLessonId] = useState(3);
            const [activeSubTab, setActiveSubTab] = useState('content');
            const [dictationInput, setDictationInput] = useState('');
            const [dictationResult, setDictationResult] = useState('');
            const [writingInput, setWritingInput] = useState('');
            const [writingFeedback, setWritingFeedback] = useState(null);

            const selectedLesson = lessonsData.find(l => l.id === selectedLessonId) || lessonsData[2];

            const checkDictation = () => {
                if (dictationInput.toLowerCase().includes('unit rate') || dictationInput.toLowerCase().includes('breakdown')) {
                    setDictationResult('🎉 Chính xác 100%! Bạn đã điền đúng thuật ngữ Unit Rate Breakdown.');
                } else {
                    setDictationResult('💡 Gợi ý: Thuật ngữ đúng là "unit rate breakdown" (cơ cấu đơn giá).');
                }
            };

            const analyzeWriting = () => {
                setWritingFeedback({
                    score: "Band C1 - Executive Level (94/100)",
                    strengths: "Cấu trúc câu đàm phán thương mại rất rõ ràng, sử dụng thành thạo thuật ngữ BOQ, Provisional Sum và Back-to-Back terms.",

                    upgradedText: "Dear Client Procurement Board, On behalf of Central Cons, I am pleased to submit our comprehensive BOQ unit rate breakdown. Furthermore, we confirm our commitment to milestone schedule adherence backed by our Tier-1 subcontractor network."
                });
            };

                <div className="min-h-screen flex flex-col">

                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 rounded-full bg-[#C86D7C] flex items-center justify-center font-bold text-white shadow">EH</div>
                            <div>
                                <h1 className="font-extrabold text-lg tracking-wide flex items-center gap-2">
                                    English Hub <span className="text-xs bg-[#C86D7C] text-white px-2 py-0.5 rounded-full uppercase tracking-wider font-semibold">Live Workspace</span>
                                </h1>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="text-right hidden sm:block">
                                <p className="font-bold text-sm text-[#FAF5EE]">Hero Kun</p>
                                <p className="text-xs text-[#C86D7C]">Head of Bidding Strategy | Central Cons</p>
                            </div>
                            <div className="w-10 h-10 rounded-full border-2 border-[#C86D7C] bg-[#383335] flex items-center justify-center text-xl shadow">🧘</div>
                        </div>
                    </header>

                    {/* Top Widgets Bar */}
                    <div className="bg-[#FAF5EE] border-b border-[#E8DFC8] px-6 py-3">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-white p-3 rounded-xl border border-[#E8DFC8] shadow-sm flex items-center gap-3">
                                <div className="p-2 bg-[#FAF5EE] text-[#C86D7C] rounded-lg text-xl">📈</div>
                                <div>
                                    <p className="text-xs text-gray-500 font-semibold uppercase">Tiến Độ Khóa Học Preply</p>
                                    <p className="text-sm font-bold text-[#231F20]">2 / 8 Buổi Hoàn Thành (25%)</p>
                                </div>
                            </div>
                            <div className="bg-white p-3 rounded-xl border border-[#E8DFC8] shadow-sm flex items-center gap-3">
                                <div className="p-2 bg-[#FAF5EE] text-[#C86D7C] rounded-lg text-xl">🔥</div>
                                <div>
                                    <p className="text-xs text-gray-500 font-semibold uppercase">Tần Suất Tuần Này</p>

                                </div>
                            </div>

                                    <p className="text-xs text-gray-500 font-semibold uppercase">Hôm Nay: Thứ Hai, 24/08/2026</p>

                                        <div className="p-1.5 rounded text-gray-400">29</div>
                                        <div className="p-1.5 rounded text-gray-400">30</div>
                                    </div>
                                </div>

                        )}

                        {/* Right Content Area */}
                        <div className={`${activeTab === 'lessons' ? 'lg:col-span-8' : 'lg:col-span-12'} space-y-6`}>
                            {activeTab === 'lessons' && (
                                <div className="bg-white p-6 rounded-2xl border border-[#E8DFC8] shadow-sm space-y-6">
                                    {/* Lesson Header Card */}
                                    <div className="border-b border-[#E8DFC8] pb-4 flex flex-col sm:flex-row justify-between sm:items-center gap-3">
                                        <div>
                                            <span className="text-xs font-extrabold uppercase tracking-wider text-[#C86D7C] bg-[#FAF5EE] px-2.5 py-1 rounded-md border border-[#E8DFC8]">
                                                {selectedLesson.id <= 2 ? 'Preply Insights Recap' : 'Live Preply Session'}
                                            </span>
                                            <h2 className="text-xl font-black text-[#231F20] mt-2">{selectedLesson.title}</h2>
                                            <p className="text-xs text-gray-600 mt-1 font-semibold">📌 Chủ đề: {selectedLesson.topic}</p>
                                        </div>
                                        <div className="text-right">
                                            <a href={selectedLesson.preplyClassUrl} target="_blank" className="inline-flex items-center gap-1.5 bg-[#231F20] text-[#FAF5EE] px-4 py-2 rounded-xl text-xs font-bold hover:bg-[#383335] shadow transition">

                                            </a>
                                            <p className="text-[11px] text-[#C86D7C] font-bold mt-1">📅 {selectedLesson.scheduleDate}</p>
                                        </div>
                                    </div>

                                    {/* Special Lesson 1 Preply Insights Box */}
                                    {selectedLesson.id === 1 && (
                                        <div className="space-y-6 text-sm">
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                                <div className="p-3 bg-[#FAF5EE] rounded-xl border border-[#E8DFC8] text-center">
                                                    <p className="text-xs text-gray-500 font-bold">Thời lượng nói</p>

                                                <div className="p-3 bg-[#FAF5EE] rounded-xl border border-[#E8DFC8] text-center">
                                                    <p className="text-xs text-gray-500 font-bold">Tốc độ nói</p>

                                                    <p className="text-xs text-gray-500 font-bold">Vốn từ tích lũy</p>
                                                    <p className="text-sm font-extrabold text-green-700 mt-1">{selectedLesson.vocabSize}</p>
                                                </div>
                                            </div>

                                            {/* Grammar Corrections */}
                                            <div>
                                                <h4 className="font-bold text-sm text-[#231F20] mb-3">🛠️ Phân Tích 5 Lỗi Ngữ Pháp & Sửa Lỗi Chi Tiết:</h4>
                                                <div className="space-y-2.5">
                                                    {selectedLesson.grammarFixes.map((gf, idx) => (
                                                        <div key={idx} className="p-3 rounded-xl bg-red-50/50 border border-red-200 text-xs">
                                                            <p className="text-red-700 line-through">❌ You said: "{gf.wrong}"</p>
                                                            <p className="text-green-700 font-bold mt-1">👉 Correction: "{gf.right}" <button onClick={() => speakText(gf.right)} className="text-[#C86D7C] ml-1">🔊</button></p>

                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Synonyms Upgrades */}
                                            <div>
                                                <h4 className="font-bold text-sm text-[#231F20] mb-3">💎 Nâng Cấp 4 Cặp Từ Đồng Nghĩa B2/C1:</h4>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                                    {selectedLesson.synonymUpgrades.map((su, idx) => (
                                                        <div key={idx} className="p-3 rounded-xl border border-[#E8DFC8] bg-[#FAF5EE]">
                                                            <p className="text-gray-500">Từ cũ: <span className="line-through">{su.user}</span></p>
                                                            <p className="font-extrabold text-[#C86D7C] text-sm mt-0.5">👉 {su.better}</p>
                                                            <p className="text-gray-700 font-semibold mt-1">{su.vi}</p>
                                                            <p className="text-gray-600 italic mt-1">"{su.ex}" <button onClick={() => speakText(su.ex)} className="text-[#C86D7C]">🔊</button></p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Pronunciation Drills */}
                                            <div>
                                                <h4 className="font-bold text-sm text-[#231F20] mb-3">🎙️ Chỉnh Phát Âm 4 Từ Trọng Tâm:</h4>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                                    {selectedLesson.pronunciationDrills.map((pd, idx) => (
                                                        <div key={idx} className="p-3 rounded-xl border border-gray-200 bg-white">
                                                            <div className="flex justify-between items-center">
                                                                <span className="font-extrabold text-sm text-[#231F20]">{pd.word} <span className="text-gray-500 text-xs">{pd.ipa}</span></span>
                                                                <button onClick={() => speakText(pd.word + '. ' + pd.ex)} className="text-xs bg-[#FAF5EE] text-[#C86D7C] px-2 py-0.5 rounded border border-[#E8DFC8]">🔊 Nghe</button>

                                            </div>
                                        </div>
                                    )}

                                    {/* 5 Subtabs Navigation for Lesson 2 & 3 */}
                                    {selectedLesson.id !== 1 && (
                                        <div>
                                            <div className="flex flex-wrap gap-2 border-b border-gray-100 pb-3">
                                                {[
                                                    { id: 'content', label: '📄 Nội dung bài học (50 Mins)' },
                                                    { id: 'listening', label: '🎧 Nghe (Listening)' },
                                                    { id: 'speaking', label: '🗣️ Nói (Speaking)' },
                                                    { id: 'reading', label: '📖 Đọc (Reading)' },
                                                    { id: 'writing', label: '✍️ Viết (Writing)' }

                                                        {st.label}
                                                    </button>
                                                ))}
                                            </div>

                                            {/* Subtab 1: Content for Lesson 3 */}
                                            {activeSubTab === 'content' && (
                                                <div className="space-y-6 text-sm mt-4">

                                                        <div className="bg-[#FAF5EE] p-4 rounded-xl border border-[#E8DFC8]">
                                                            <div className="flex justify-between items-center mb-2">
                                                                <h4 className="font-bold text-xs uppercase tracking-wider text-[#C86D7C]">🎙️ Executive Bidding Pitch:</h4>
                                                                <button onClick={() => speakText(selectedLesson.selfIntroPitch)} className="text-xs bg-[#231F20] text-white px-2.5 py-1 rounded-md hover:bg-black font-semibold flex items-center gap-1">
                                                                    <span>🔊 Nghe đọc mẫu</span>
                                                                </button>
                                                            </div>
                                                            <p className="text-xs text-gray-800 italic leading-relaxed">"{selectedLesson.selfIntroPitch}"</p>
                                                        </div>
                                                    )}

                                                    {/* Power Words Table */}
                                                    {selectedLesson.powerWords && (
                                                        <div>
                                                            <h4 className="font-bold text-sm text-[#231F20] mb-3 flex items-center gap-2">
                                                                <span>💎 Key Vocabulary & Power Phrases (B2 - C1):</span>
                                                            </h4>
                                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                                {selectedLesson.powerWords.map((pw, idx) => (
                                                                    <div key={idx} className="p-3 rounded-xl border border-gray-200 bg-white shadow-sm hover:border-[#C86D7C] transition">
                                                                        <div className="flex justify-between items-start">
                                                                            <div>
                                                                                <span className="font-extrabold text-[#231F20] text-sm">{pw.word}</span>
                                                                                <span className="text-xs text-gray-500 ml-1.5">{pw.ipa}</span>
                                                                            </div>
                                                                            <button onClick={() => speakText(pw.word + '. ' + pw.ex)} className="text-xs text-[#C86D7C] hover:text-black">🔊</button>
                                                                        </div>
                                                                        <p className="text-xs font-semibold text-[#C86D7C] mt-1">{pw.vi}</p>
                                                                        <p className="text-[11px] text-gray-600 mt-1 italic">"{pw.ex}"</p>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* Grammar Focus */}

                                                            <h4 className="font-bold text-sm text-[#231F20] mb-3">📐 Grammar Focus for Commercial Bidding:</h4>

                                                                {selectedLesson.grammarFocus.map((g, idx) => (
                                                                    <div key={idx} className="p-3 rounded-xl bg-gray-50 border border-gray-200">
                                                                        <p className="font-bold text-xs text-[#231F20]">{g.title}</p>
                                                                        <p className="text-xs text-gray-600 mt-0.5">📐 <strong>Công thức:</strong> <code className="bg-white px-1.5 py-0.5 rounded text-[#C86D7C] font-semibold">{g.formula}</code></p>
                                                                        <p className="text-xs text-gray-700 mt-1 italic">💡 "{g.example}" <button onClick={() => speakText(g.example)} className="text-xs text-[#C86D7C] ml-1">🔊</button></p>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* Anticipated Q&A */}
                                                    {selectedLesson.anticipatedQA && (
                                                        <div>
                                                            <h4 className="font-bold text-sm text-[#231F20] mb-3">❓ Anticipated High-Pressure Q&A with Client:</h4>
                                                            <div className="space-y-3">
                                                                {selectedLesson.anticipatedQA.map((qa, idx) => (
                                                                    <div key={idx} className="p-3.5 rounded-xl border border-[#E8DFC8] bg-[#FAF5EE]">
                                                                        <p className="font-bold text-xs text-[#231F20]">Q: "{qa.q}" <button onClick={() => speakText(qa.q)} className="text-xs text-[#C86D7C]">🔊</button></p>
                                                                        <p className="text-xs text-gray-700 mt-1">A: "{qa.a}" <button onClick={() => speakText(qa.a)} className="text-xs text-[#C86D7C]">🔊</button></p>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            {/* Subtab 2: Listening */}
                                            {activeSubTab === 'listening' && (
                                                <div className="space-y-4 text-xs mt-4">
                                                    <div className="bg-[#FAF5EE] p-4 rounded-xl border border-[#E8DFC8]">

                                                        <p className="text-gray-700 italic leading-relaxed">
                                                            "Client: Hero, why is your concrete unit rate priced at $120 per cubic meter?<br/>
                                                            Hero: Our unit rate includes high-early-strength additives to guarantee rapid 3-day top-down cycle casting without cracks."
                                                        </p>

                                                            🔊 Nghe Toàn Bộ Hội Thoại
                                                        </button>
                                                    </div>
                                                    <div className="p-4 border rounded-xl bg-white space-y-2">

                                                        <p className="text-gray-600">Điền từ còn thiếu: <em>"Central Cons provides a transparent _______ breakdown for all structural packages."</em></p>
                                                        <div className="flex gap-2">
                                                            <input value={dictationInput} onChange={e => setDictationInput(e.target.value)} placeholder="Nhập từ vựng..." className="border p-2 rounded-lg flex-1 text-xs" />

                                                        </div>
                                                        {dictationResult && <p className="font-bold text-[#C86D7C]">{dictationResult}</p>}
                                                    </div>
                                                </div>
                                            )}

                                            {/* Subtab 3: Speaking */}
                                            {activeSubTab === 'speaking' && (
                                                <div className="space-y-4 text-xs mt-4">
                                                    <div className="bg-white p-4 border rounded-xl space-y-3">
                                                        <h4 className="font-bold text-sm text-[#231F20]">🗣️ Speaking Reflex (PREP Framework):</h4>
                                                        <div className="p-3 bg-gray-50 rounded-lg space-y-1">
                                                            <p><strong>P (Point):</strong> Central Cons guarantees fixed unit rates for the first 12 months.</p>
                                                            <p><strong>R (Reason):</strong> Because we hold pre-negotiated bilateral agreements with Hoa Phat Steel.</p>
                                                            <p><strong>E (Example):</strong> At The Hallmark and Song Viet 1-13 projects, zero material price claims occurred.</p>
                                                            <p><strong>P (Point):</strong> Therefore, the Client enjoys complete financial predictability.</p>
                                                        </div>
                                                        <button onClick={() => speakText("Central Cons guarantees fixed unit rates for the first 12 months because we hold pre-negotiated bilateral agreements with Hoa Phat Steel. At The Hallmark and Song Viet projects, zero material price claims occurred. Therefore, the Client enjoys complete financial predictability.")} className="bg-[#231F20] text-white px-3 py-1.5 rounded-lg font-bold">
                                                            🔊 Nghe phát âm mẫu PREP
                                                        </button>
                                                    </div>
                                                </div>
                                            )}

                                            {/* Subtab 4: Reading */}
                                            {activeSubTab === 'reading' && (
                                                <div className="space-y-4 text-xs mt-4">
                                                    <div className="p-4 bg-gray-50 rounded-xl border border-gray-200">
                                                        <h4 className="font-bold text-sm text-[#231F20] mb-2">📖 Tender Specification: Subcontractor Liability & Provisional Sums</h4>
                                                        <p className="text-gray-700 leading-relaxed">
                                                            "Under FIDIC Red Book Clause 13.5, each Provisional Sum shall only be used, in whole or in part, in accordance with the Engineer's instructions. The Contractor shall produce all invoices and receipts for expenditure."
                                                        </p>
                                                        <button onClick={() => speakText("Under FIDIC Red Book Clause 13.5, each Provisional Sum shall only be used, in whole or in part, in accordance with the Engineer's instructions. The Contractor shall produce all invoices and receipts for expenditure.")} className="mt-2 text-[#C86D7C] font-bold">
                                                            🔊 Nghe đọc văn bản
                                                        </button>
                                                    </div>
                                                </div>
                                            )}

                                            {/* Subtab 5: Writing */}
                                            {activeSubTab === 'writing' && (
                                                <div className="space-y-3 text-xs mt-4">
                                                    <h4 className="font-bold text-sm text-[#231F20]">✍️ Commercial Email Draft (Soạn thư bảo vệ đơn giá thầu):</h4>
                                                    <textarea
                                                        value={writingInput}
                                                        onChange={e => setWritingInput(e.target.value)}
                                                        rows="4"
                                                        placeholder="Soạn nháp email giải trình đơn giá thầu gửi CĐT..."
                                                        className="w-full border p-3 rounded-xl text-xs"
                                                    ></textarea>
                                                    <button onClick={analyzeWriting} className="bg-[#C86D7C] text-white px-4 py-2 rounded-lg font-bold">
                                                        ⚡ Phân Tích & Nâng Cấp AI (C1/C2)
                                                    </button>
                                                    {writingFeedback && (
                                                        <div className="p-4 bg-[#FAF5EE] border border-[#C86D7C] rounded-xl space-y-2">
                                                            <p className="font-bold text-green-700">{writingFeedback.score}</p>
                                                            <p><strong>Nhận xét:</strong> {writingFeedback.strengths}</p>
                                                            <p><strong>Bản nâng cấp C1:</strong> <span className="italic">"{writingFeedback.upgradedText}"</span> <button onClick={() => speakText(writingFeedback.upgradedText)} className="text-[#C86D7C]">🔊</button></p>
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Meeting Tab */}
                            {activeTab === 'meeting' && (
                                <div className="bg-white p-6 rounded-2xl border border-[#E8DFC8] shadow-sm space-y-4 text-xs">
                                    <h2 className="text-lg font-black text-[#231F20]">1. LOTTE Properties HCMC — The Hallmark Site Visit & VE Discussion</h2>
                                    <div className="p-4 bg-[#FAF5EE] border border-[#E8DFC8] rounded-xl">
                                        <p className="font-bold text-[#C86D7C]">Approved Song Viet Plot 1-13 VE Savings: VND 41.22 Billion</p>
                                        <p className="text-gray-600 mt-1">Structure: -13.44B | Architecture: -12.80B | Waterproofing: -5.42B | Retention Cash Flow: -9.55B</p>
                                    </div>
                                </div>
                            )}

                            {/* JD Tab */}
                            {activeTab === 'jd' && (
                                <div className="bg-white p-6 rounded-2xl border border-[#E8DFC8] shadow-sm space-y-4 text-xs">
                                    <h2 className="text-lg font-black text-[#231F20]">📋 BẢNG MÔ TẢ CÔNG VIỆC (JOB DESCRIPTION - SONG NGỮ)</h2>
                                    <p><strong>Position:</strong> Head of Estimating & Pricing Division / Deputy Head of Tendering</p>
                                    <p><strong>Organization:</strong> Central Construction Joint Stock Company (Central Cons)</p>
                                </div>
                            )}

                            {/* Studio Tab */}
                            {activeTab === 'studio' && (
                                <div className="bg-white p-6 rounded-2xl border border-[#E8DFC8] shadow-sm space-y-4 text-xs">
                                    <h2 className="text-lg font-black text-[#231F20]">🎙️ Preply Rehearsal Studio (Thu Âm & Đo WPM)</h2>
                                    <p className="text-gray-600">Đọc thử bài phát biểu 50s trước khi vào lớp với cô Lorraine để khởi động khẩu hình.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
